name: Bug report
description: Report reproducible incorrect behavior in Magnet.
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Magnet version
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a repository or complete steps when possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: shell
